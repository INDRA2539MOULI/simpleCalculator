<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <style>
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .outer {
            display: grid;
            grid-template-columns: repeat(4, minmax(50px, 80px));
            grid-template-rows: repeat(5, minmax(50px, 80px));
            gap: 6px;
            background-color: black;
            width: fit-content;
            /*to adjust the width of container same as contents inside*/
        }

        .display {
            width: 335px;
            height: 80px;
            background-color: antiquewhite;
            border: 4px solid black;
            border-radius: 6px;
        }
        
        /* to avoid disturbance of below containers due to animations */
        #typed-output {
            display: inline-block;
            width: 300px;
          
            height: 40px;
            overflow: hidden;
            text-align: center;

        }
    </style>
</head>

<body>
    <span id="typed-output" style="color:darkcyan;font-size: 30px;font-weight: 30px;" class="mb-3"></span>
    <div class="display mb-2">
        <h4></h4>
    </div>
    <div class="outer">
        <button class="btn btn-primary">AC</button>
        <button class="btn btn-primary">DEL</button>
        <button class="btn btn-primary">SQRT</button>
        <button class="btn btn-primary">/</button>
        <button class="btn btn-primary">1</button>
        <button class="btn btn-primary">2</button>
        <button class="btn btn-primary">3</button>
        <button class="btn btn-primary">*</button>
        <button class="btn btn-primary">4</button>
        <button class="btn btn-primary">5</button>
        <button class="btn btn-primary">6</button>
        <button class="btn btn-primary">-</button>
        <button class="btn btn-primary">7</button>
        <button class="btn btn-primary">8</button>
        <button class="btn btn-primary">9</button>
        <button class="btn btn-primary">+</button>
        <button class="btn btn-primary">%</button>
        <button class="btn btn-primary">0</button>
        <button class="btn btn-primary">.</button>
        <button class="btn btn-primary">=</button>
    </div>

    <script>
        var typed = new Typed("#typed-output", {
            strings: ["HII", "THIS IS A","SIMPLE CALCULATOR", "DONE BY","INDRA MOULI"],
            typeSpeed: 50,  // Speed of typing (milliseconds)
            backSpeed: 25,  // Speed of deleting (milliseconds)
            loop: true      // Keep repeating the text
        });
        let p = document.querySelector("h4");
        let btns = document.querySelectorAll("button");
        btns.forEach((btn) => {
            btn.addEventListener("click", (event) => {
                event.preventDefault();
                console.log(event.target);
                console.log(event.target.innerText);
                let x = event.target.innerText
                if (x === "=") {
                    p.innerHTML = eval(p.innerHTML);
                }
                else if (x === "AC") {
                    p.innerHTML = "";
                }
                else if (x == "SQRT") {
                    p.innerHTML = Math.sqrt(eval(p.innerHTML));
                }
                else if (x === "DEL") {
                    p.innerHTML = p.innerHTML.slice(0, -1);                  //slice(start,stop (excluded)).  slice(0,-n) removes last n character. slice(-2) returns last two elements
                }
                else {
                    p.innerHTML += x;
                }
            })
        })
    </script>
</body>

</html>
